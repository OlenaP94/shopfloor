[project]
name = "shopfloor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "OlenaP94", email = "93668425+OlenaP94@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
shopfloor = "shopfloor:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
